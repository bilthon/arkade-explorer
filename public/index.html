<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arkade Batch Explorer — PoC</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cg stroke='%23f7931a' stroke-width='2.2' stroke-linecap='round'%3E%3Cline x1='16' y1='10' x2='9' y2='22'/%3E%3Cline x1='16' y1='10' x2='23' y2='22'/%3E%3C/g%3E%3Cg fill='%23f7931a'%3E%3Ccircle cx='16' cy='9' r='4'/%3E%3Ccircle cx='9' cy='23' r='3.4'/%3E%3Ccircle cx='23' cy='23' r='3.4'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Arkade Batch Explorer <span class="poc">proof of concept</span></h1>
      <div id="stats" class="stats"></div>
    </header>

    <main>
      <section id="list-pane">
        <h2>Recent batch commitments</h2>
        <table id="batches">
          <thead>
            <tr><th>commitment txid</th><th>time</th><th class="num">vtxos</th><th class="num">amount</th><th class="num">fee</th><th>swept</th></tr>
          </thead>
          <tbody id="batches-body">
            <tr><td colspan="6" class="empty">waiting for batches… run the ingest worker</td></tr>
          </tbody>
        </table>
        <div id="pager" class="pager"></div>
      </section>

      <section id="detail-pane" hidden>
        <button id="back">← back</button>
        <div id="detail"></div>
      </section>
    </main>
    <footer>
      <a href="https://github.com/bilthon/arkade-explorer" target="_blank" rel="noopener noreferrer">Arkade Batch Explorer — source on GitHub ↗</a>
    </footer>
    <script src="/app.js" type="module"></script>
  </body>
</html>
